name: Build static site

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy build to master
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch origin master
          site_dir="$RUNNER_TEMP/elo-static-site"
          rm -rf "$site_dir"
          mkdir -p "$site_dir"
          cp -R dist/. "$site_dir/"
          cp CNAME "$site_dir/CNAME"
          git switch -C master origin/master
          git clean -fdx
          cp -R "$site_dir/." ./
          script_path="$(sed -nE 's/.*src="([^"]+\.js)".*/\1/p' index.html)"
          test -n "$script_path"
          test -f ".${script_path}"
          git add -A
          if git diff --cached --quiet; then
            echo "Static site is unchanged."
          else
            git commit -m "build: deploy dev static site"
            git push origin HEAD:master
          fi
